<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Money</title>
<style>
:root{--bg:#fbf5d6;--card:#fffdf1;--ink:#2b2a22;--mute:#8a8567;--line:#ebe2b0;--acc:#f2b705;--acc2:#8a6a00;--exp:#d6453d;--inc:#2e9e5b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a16;--card:#2a2923;--ink:#f1efe2;--mute:#a29e84;--line:#3b392f;--acc2:#f2c94c;--exp:#ff6b61;--inc:#4cc982;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1a16;--card:#2a2923;--ink:#f1efe2;--mute:#a29e84;--line:#3b392f;--acc2:#f2c94c;--exp:#ff6b61;--inc:#4cc982;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
header h1{font:700 22px Georgia,"Times New Roman",serif;margin:0}
#main{flex:1;overflow:auto;padding:0 14px 90px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;padding:7px 0;font-size:11px;color:var(--mute)}
nav span{display:block;font-size:19px}
nav .on{color:var(--acc2);font-weight:700}
.fab{position:absolute;right:16px;bottom:74px;width:54px;height:54px;border-radius:50%;background:var(--acc);color:#2b2a22;font-size:28px;box-shadow:0 3px 10px #0005}
.mn{display:flex;justify-content:space-between;align-items:center;margin:2px 0 8px;font-weight:700}
.mn button{font-size:24px;padding:2px 16px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;margin-bottom:8px}
.sum.two{grid-template-columns:1fr 1fr}
small{color:var(--mute);font-size:12px;display:block}
.ex{color:var(--exp)}.in{color:var(--inc)}
.dh{margin:14px 2px 5px;color:var(--mute);font-size:13px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.ic{font-size:21px;width:36px;height:36px;flex:none;display:grid;place-items:center;background:var(--bg);border-radius:10px}
.rm{flex:1;min-width:0}.rm b,.rm small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:700}
.emp{text-align:center;color:var(--mute);margin:40px 0}
.seg{display:flex;gap:6px;margin:8px 0}
.seg button{flex:1;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.seg .on{background:var(--acc);color:#2b2a22;font-weight:700;border-color:var(--acc)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.chart svg{width:100%;display:block}
.chart text{fill:var(--mute);font-size:9px}
.h2{font-weight:700;margin:16px 2px 6px}
.btn{width:100%;padding:11px;border-radius:12px;border:1px dashed var(--acc2);color:var(--acc2);margin-top:6px}
#ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}
#ov[hidden]{display:none}
#sh{background:var(--bg);width:100%;max-width:480px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.sh-h{display:flex;justify-content:space-between;align-items:center}
.pri{background:var(--acc);color:#2b2a22;padding:7px 16px;border-radius:10px;font-weight:700}
label{display:block;font-size:12px;color:var(--mute);margin-top:8px}
select,input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-top:3px}
.disp{font:600 34px/1.2 system-ui,sans-serif;text-align:right;padding:8px 4px;overflow-x:auto;white-space:nowrap}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 8px}
.pad button{padding:13px 0;font-size:20px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.pad .op{background:var(--acc);color:#2b2a22}
.pad .eq{grid-column:span 3}
.del{width:100%;padding:11px;color:var(--exp);margin-top:6px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#dw{position:fixed;inset:0;background:#0008;z-index:10}#dw[hidden]{display:none}
#dr{background:var(--card);width:80%;max-width:320px;height:100%;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 0 18px;animation:sl .18s ease-out}
@keyframes sl{from{transform:translateX(-100%)}}
.dr-h{padding:0 20px 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.dr-s{padding:14px 20px 4px;color:var(--mute);font-size:13px}
.dr-i{display:flex;align-items:center;gap:16px;width:100%;padding:13px 20px;text-align:left}
.dr-i span{font-size:20px;width:26px;text-align:center}
#lk{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}#lk[hidden]{display:none}
.lk-b{width:100%;max-width:320px;text-align:center;padding:0 20px}
.lk-b h2{font:700 20px Georgia,serif;margin:6px 0 14px}
.dots{display:flex;justify-content:center;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc2)}
.dots i.on{background:var(--acc2)}
.lk-m{height:22px;margin:10px 0;color:var(--exp);font-size:13px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kp button{padding:14px 0;font-size:24px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.lk-l{margin-top:16px;color:var(--acc2);padding:8px}
#lg{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;display:flex;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}#lg[hidden]{display:none}
.lg-b{width:100%;max-width:400px;padding:30px 22px;text-align:center;margin:auto 0}
.lgi{width:64px;height:64px;border-radius:18px;background:var(--acc);font-size:34px;display:grid;place-items:center;margin:0 auto}
.gbtn{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;font-weight:700;box-shadow:0 2px 8px #0001}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);margin:16px 0 4px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.fld{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 12px;margin-top:12px}
.fld input{border:0;background:none;margin:0;padding:15px 0;outline:0;flex:1;min-width:0}
.lgp{width:100%;padding:14px;border-radius:14px;font-size:16px;margin-top:6px}
.rcb{font:700 30px/1.2 ui-monospace,Menlo,monospace;letter-spacing:3px;background:var(--card);border:1px dashed var(--acc2);border-radius:14px;padding:18px;margin:10px 0}
.phr{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pht{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--card);cursor:pointer}
.pht img{width:100%;height:100%;object-fit:cover;display:block}
.pht button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#000a;color:#fff;font-size:11px}
.phadd{margin:0;display:flex;align-items:center;justify-content:center;height:64px;padding:0 14px;border:1px dashed var(--acc2);border-radius:10px;color:var(--acc2);font-size:13px;cursor:pointer}
#pv{position:fixed;inset:0;z-index:25;background:#000d;overflow:auto;padding:calc(52px + env(safe-area-inset-top,0px)) 12px 20px;text-align:center}#pv[hidden]{display:none}
#pv img{max-width:100%;border-radius:8px;margin-bottom:12px}
#ov.ctr{align-items:center;padding:0 16px}
#ov.ctr #sh{border-radius:18px;max-width:420px;padding:20px 16px;background:var(--card)}
.dti{text-align:center;color:var(--acc2);font:700 21px Georgia,serif;margin:0 0 10px}
.dop{display:grid;grid-template-columns:104px 1fr;align-items:start}
.dop>b{padding:12px 0;font-weight:600}
.dop>div button{display:block;width:100%;text-align:left;padding:12px 6px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);font-size:14px;border-radius:8px}
.dop>div button.on{color:var(--ink);font-weight:700}
.dop>div button.on:before{content:"✓ ";color:var(--acc2)}
.dinfo{display:flex;gap:10px;align-items:flex-start;color:var(--mute);font-size:13px;margin-top:12px}
.ii{width:22px;height:22px;flex:none;border:2px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.avb{display:block;margin:12px auto;padding:10px 22px;border:2px solid var(--acc2);border-radius:12px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.avo{display:block;width:100%;text-align:left;padding:14px 8px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}
.avo.on{color:var(--ink);font-weight:700}
.ctr2{display:flex;align-items:center;gap:12px;margin:10px 0}
.ctr2>b{min-width:62px;font-weight:600}
.ctr2 input{flex:1;min-width:0;margin:0;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.tp{display:flex;gap:16px}
.tp button{text-transform:uppercase;letter-spacing:.5px;color:var(--mute);padding:6px 2px;font-size:16px}
.tp button.on{color:var(--ink);font-weight:600}
.tp button.on:before{content:"✓ ";color:var(--acc2)}
.igr{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-height:156px;overflow:auto;border:2px solid var(--line);border-radius:14px;padding:8px;margin:8px 0 14px;background:var(--card)}
.igr button{display:grid;place-items:center;padding:4px;border-radius:12px}
.igr button.on{background:var(--line)}
.igr span{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;font-size:22px}
.cbtn{display:flex;justify-content:center;gap:16px}
.cbtn button{border:2px solid var(--acc2);border-radius:10px;padding:10px 24px;min-width:118px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.chip{border:1px solid currentColor;border-radius:6px;padding:1px 6px;font-weight:600;font-size:13px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:2px solid var(--line);margin-bottom:10px}
.cal b{text-align:center;padding:8px 0;font-weight:600;border-bottom:2px solid var(--line)}
.cal div{min-height:58px;padding:4px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);font-size:11px;overflow:hidden}
.cal i{font-style:normal;color:var(--mute);display:block;font-size:13px}
.cal em{font-style:normal;display:block;text-align:center;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ovw{display:flex;align-items:center;gap:6px;margin:6px 0 12px}
.dn{width:58%;max-width:250px;flex:none}
.dn text{fill:var(--ink)}
.leg{flex:1;min-width:0}
.leg div{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg i{width:14px;height:14px;flex:none}
.orow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.ovw+.orow{border-top:1px solid var(--line)}
.oi{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:22px}
.orow.on .oi{outline:2px solid var(--acc2)}
.ot{display:flex;justify-content:space-between;gap:8px}
.ot span{white-space:nowrap;font-weight:600}
.pbar{height:12px;border:2px solid var(--acc2);border-radius:8px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--acc2)}
.pc{font-weight:600;min-width:62px;text-align:right}
#sr{position:fixed;inset:0;z-index:8;background:var(--bg);display:flex;flex-direction:column;max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}#sr[hidden]{display:none}
.srb{display:flex;align-items:center;gap:6px;padding:10px 12px}
.srb button{font-size:22px;padding:4px 10px}
.srb input{margin:0;flex:1}
#srr{flex:1;overflow:auto;padding:0 14px 24px}
.acc{border:1px solid var(--acc2);background:var(--card);border-radius:14px;padding:12px 14px}
.acc.ig{opacity:.55}
.ai{width:56px;height:56px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:28px;background:var(--bg);border:1px solid var(--line)}
.bh{font-weight:700;font-size:18px;margin:18px 2px 4px;padding-bottom:8px;border-bottom:2px solid var(--acc2)}
.bc{padding:12px 2px;border-bottom:1px solid var(--line)}
.bt{display:flex;align-items:center;gap:12px}
.bt b{flex:1;font-size:17px}
.bg{display:flex;justify-content:space-between;align-items:flex-end;margin:8px 0 6px 60px;line-height:1.6}
.br{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.bc .pbar{margin-left:60px}
.flag{background:var(--inc);color:#fff;padding:3px 12px 3px 8px;font-size:13px;font-weight:600;clip-path:polygon(0 0,100% 0,100% 62%,88% 100%,0 100%)}
.flag.neg{background:var(--exp)}
.nb{display:flex;align-items:center;gap:14px;padding:10px 2px}
.sbb{border:2px solid var(--acc2);border-radius:10px;padding:10px 18px;min-width:150px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.hb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 8px 10px;margin-bottom:6px}
.hb .mn{margin:2px 0 6px}
.hb .sum{border:0;background:none;padding:4px;margin:0}
:root{--bar:#f4ecbd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#34332b}}
:root[data-theme="dark"]{--bar:#34332b}
header{background:var(--bar);padding-bottom:4px}
#title{font:400 30px/1 "Brush Script MT","Segoe Script","Snell Roundhand","Lucida Handwriting",cursive;color:var(--acc2)}
.hb{position:sticky;top:0;z-index:2;background:var(--bar);margin:0 -14px 10px;padding:0 14px 8px;border:0;border-radius:0;box-shadow:0 1px 0 var(--line)}
#title.tn{font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;min-width:0}
#title.tn span{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#title.tn button{font-size:24px;padding:2px 8px!important}
header>button{padding:4px 6px!important}
header>button:first-child{padding-left:0!important}
header{flex-wrap:wrap;row-gap:0;padding-bottom:0}
#brand{flex:1;min-width:0;padding-left:4px;white-space:nowrap;font:400 30px/1.1 "Brush Script MT","Segoe Script","Snell Roundhand","Lucida Handwriting",cursive;color:var(--acc2)}
#title{order:9;flex:0 0 100%!important}
#title:empty{display:none}
#title.tn{padding:0 0 6px}
#ov.full{align-items:stretch;padding:0;background:var(--bg)}
#ov.full #sh{max-width:480px;height:100%;max-height:100%;border-radius:0;display:flex;flex-direction:column;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(10px + env(safe-area-inset-bottom,0px))}
.tb{display:flex;justify-content:space-between}
.tb button{color:var(--acc2);font-size:17px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding:8px 4px}
.tt{display:flex;align-items:center;justify-content:center;gap:10px}
.tt button{text-transform:uppercase;letter-spacing:.5px;font-size:16px;color:var(--mute);display:flex;align-items:center;gap:6px;padding:6px 2px}

.tt i{width:2px;height:28px;background:var(--line)}
.ck{width:26px;height:26px;border-radius:50%;background:var(--acc2);color:var(--bg);display:grid;place-items:center;font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.g2 label{text-align:center;font-size:15px;margin-top:0}
.g2 select{margin-top:6px;appearance:none;-webkit-appearance:none;text-align:center;text-align-last:center;border:2px solid var(--line);border-radius:14px;padding:14px 8px;font-weight:600;font-size:16px}
#ov.full textarea{flex:1 1 90px;min-height:80px;resize:none;font:inherit;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.amtb{display:flex;align-items:center;justify-content:flex-end;gap:12px;border:2px solid var(--line);border-radius:14px;padding:4px 14px}

.dt{flex:none;border-top:1px solid var(--line)}

/* Records / summary layout like the reference */
.hb{padding-top:10px}
.hb .sum{gap:4px}
.hb .sum small{display:block;text-transform:uppercase;letter-spacing:.5px;font-size:14px;font-weight:500;color:var(--ink)}
.hb .sum b{display:block;font-size:18px;font-weight:500;margin-top:4px}
.dh{margin:24px 0 0;padding:8px 6px;color:var(--ink);font-size:16px;font-weight:600;border-bottom:2px solid var(--mute)}
.rrow{position:relative;background:none;border:0;border-radius:0;margin:0;padding:8px 8px 8px 8px;gap:12px}
.rrow::after{content:"";position:absolute;left:68px;right:0;bottom:0;border-bottom:1px solid var(--line)}
.rrow .ic{width:48px;height:48px;border-radius:50%;font-size:22px}
.rrow .rm b{font-size:17px;font-weight:500}
.rrow .rm small{font-size:14px;color:var(--mute)}
.rrow .rm small.ac{display:flex;align-items:center;gap:8px;margin-top:3px}
.rrow .ac i{font-style:normal;flex:none;width:22px;height:22px;border-radius:6px;background:var(--line);display:grid;place-items:center;font-size:13px}
.rrow .ac span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rrow .amt{font-size:17px;font-weight:500;padding-right:4px;white-space:nowrap}

/* Categories screen like the reference */
.tot{text-align:center;font-size:20px;color:var(--ink);margin:4px 0 14px}
.crow{cursor:pointer;padding-top:6px;padding-bottom:6px}
.crow::after{display:none}
